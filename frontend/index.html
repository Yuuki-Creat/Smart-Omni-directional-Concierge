<!-- アプリケーション土台　入口のみを構築⇒中身は個別にVue3画面を表示 -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport設定(スマホサイズ対応) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Omni-directional-Concierge</title>
  </head>
  <body>
    <!-- Vue3アプリがマウント（展開）される空の箱 -->
    <div id="app"></div>
    <!-- Vue3起動用のJavaScriptを読み込む -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
